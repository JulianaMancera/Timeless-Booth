<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sticker Studio — Pick Your Photo Strip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800;900;1000&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/strip.css">
<link rel="stylesheet" href="css/landing.css">
</head>
<body>

  <div class="page">
    <a class="back-link" href="index.html">&larr; Back to the studio</a>
    <div class="eyebrow">✦ step one ✦</div>
    <h1 class="title">Pick your<br>photo vibe</h1>
    <div class="subtitle">choose a cute little shape for your photo-strip story</div>

    <div class="layouts-stage">
      <div class="layout-grid" id="layoutGrid" role="tablist" aria-label="Strip layouts"></div>

      <div class="strip-column hero-strip-preview">
        <div class="strip-label" id="previewLayoutName">Preview</div>
        <div class="film-strip" id="previewStrip"></div>
        <label class="design-choice" for="designSelect">
          <span>Pick a strip design</span>
          <select id="designSelect" aria-label="Choose a strip design">
            <option value="rose">Sweetheart</option>
            <option value="sky">Cloud nine</option>
            <option value="lavender">Dreamy lilac</option>
            <option value="mint">Minty fresh</option>
            <option value="classic">Cream soda</option>
          </select>
        </label>
        <a class="shutter-btn" id="enterBoothLink" href="booth.html?layout=classic4">Let's take pics <span aria-hidden="true">→</span></a>
      </div>
    </div>
  </div>

  <script src="js/layout-presets.js"></script>
  <script src="js/layouts.js"></script>
</body>
</html>
